name: Compilar APK
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          
      - name: Descargar Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.2-bin.zip
          unzip -q gradle-8.2-bin.zip
          
      - name: Crear wrapper
        run: |
          mkdir -p gradle/wrapper
          echo "distributionBase=GRADLE_USER_HOME" > gradle/wrapper/gradle-wrapper.properties
          echo "distributionPath=wrapper/dists" >> gradle/wrapper/gradle-wrapper.properties
          echo "distributionUrl=https\://services.gradle.org/distributions/gradle-8.2-bin.zip" >> gradle/wrapper/gradle-wrapper.properties
          
      - name: Crear gradlew
        run: |
          echo '#!/bin/sh' > gradlew
          echo 'exec ./gradle-8.2/bin/gradle "$@"' >> gradlew
          chmod +x gradlew
          
      - name: Compilar
        run: ./gradlew assembleDebug
        
      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: CesarinMax-QR
          path: app/build/outputs/apk/debug/app-debug.apk
